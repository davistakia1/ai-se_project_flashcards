<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Takia Davis" />
    <meta
      name="description"
      content="A smart flashcard tool that helps students study efficiently"
    />
    <meta
      name="keywords"
      content="custom decks, study aids, flashcards, learning materials"
    />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />

    <link rel="stylesheet" href="assets/css/index.css" />

    <title>Tech In A Flash</title>
  </head>

  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>

      <nav class="nav">
        <ul class="nav__links">
          <li class="nav__link">
            <a class="nav__link" href="#home">My Decks</a>
          </li>
          <li class="nav__link">
            <a class="nav__link" href="#about">About</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section id="home" class="gallery">
        <h2 class="gallery__title">My Decks</h2>
        <ul class="gallery__list"></ul>
      </section>
      <div class="mobile-bar">
        <button type="button" class="mobile-bar__button">+ New Deck</button>
      </div>
      <section id="deck-view" class="gallery">
        <div class="gallery__header">
          <h2 class="gallery__title"></h2>
          <button type="button" class="gallery__practice-btn">Practice</button>
        </div>
        <div class="wrapping-row">
          <ul class="gallery__list wrapping-row__display-contents"></ul>
          <button type="button" class="gallery__new-card-btn">
            + New Card
          </button>
        </div>
      </section>

      <template id="deck-template">
        <li class="card card_color_green">
          <a class="card__link" href="#"></a>

          <h3 class="card__title"></h3>

          <div class="card__row">
            <p class="card__count"></p>

            <button
              class="card__btn card__btn_type_delete"
              type="button"
              aria-label="delete this deck"
            ></button>
          </div>
        </li>
      </template>
      <template id="card-template">
        <li class="card card_color_green">
          <div class="card__row card__row_type_deck-view">
            <h3 class="card__title"></h3>

            <button
              class="card__btn card__btn_type_flip"
              type="button"
              aria-label="Flip this card"
            ></button>
            <button
              class="card__btn card__btn_type_delete"
              type="button"
              aria-label="delete this deck"
            ></button>
          </div>
        </li>
      </template>

      <section id="not-found" class="not-found">
        <h2 class="not-found__status-code">404</h2>
        <p class="not-found__text">Sorry, nothing found!</p>
      </section>

      <section class="carousel">
        <h2 class="carousel__title">HMTL Tags Deck &middot; 1/10</h2>
        <div class="carousel__row">
          <button
            type="button"
            aria-label="Go to previous card"
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
          ></button>

          <div class="carousel__card">
            <p class="carousel__card-text">Basic HTML Tags</p>
          </div>

          <button
            type="button"
            aria-label="Go to next card"
            class="carousel__btn carousel__btn_type_right"
          ></button>
        </div>
        <button
          type="button"
          aria-label="Flip card"
          class="carousel__btn carousel__btn_type_flip"
        ></button>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy; 2026 Takia Davis</p>
    </footer>
    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
